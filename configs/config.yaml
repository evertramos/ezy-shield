# EzyShield main configuration — example/template
# Secrets must never appear here. Use env: references or systemd LoadCredential=.
# See docs/internal/schemas/config/config.schema.json for the full JSON schema.

# Directory for runtime state (SQLite, socket)
data_dir: /var/lib/ezyshield

# Control socket path (unix); CLI commands connect here
socket_path: /run/ezyshield/ezyshield.sock

# Detection rules are embedded in the binary and update with it. To tune or
# add rules, drop *.yaml files in rules.d — they merge over the built-in
# rules by `name` and survive updates (docs: guides/rules-customization).
# rules_dir: /etc/ezyshield/rules.d      # default
# rules_path: /etc/ezyshield/rules.yaml  # DEPRECATED: replaces ALL rules, disables rules.d

# Structured logging
log:
  level: info   # debug | info | warn | error

# Log collectors — add sources after running 'ezyshield init && ezyshield scan'
collectors: []

# Example (uncomment after the nftables enforcer is set up):
# enforce:
#   nftables: {}
#   # table and set are optional; defaults are "inet ezyshield" / "blocked"
#   # (IPv6 twin derives as "<set>6"). Custom names require an
#   # ezyshield-enforcer of the same version.
#   # nftables:
#   #   table: inet mytable
#   #   set:   myblocked
#
#   # Cloudflare edge enforcer — blocks IPs at the CF edge (issue #45, #88).
#   # Two modes are supported; pick one.
#   # cloudflare:
#     # api_token: env:CLOUDFLARE_API_TOKEN  # must be "env:VARNAME"; inline values rejected
#     # action: block                      # block | challenge | js_challenge (default: block)
#     # debounce: 15s                      # coalesce rapid ban/unban mutations into one
#     #                                    # batched API push per window (default: 15s)
#     # expire_flush_interval: 3m          # batch item removals (expired bans, unbans) on
#     #                                    # this cadence in "lists" mode (default: 3m)
#     #
#     # Mode "lists" (default, recommended; works on the free plan).
#     # One Custom IP List at the account level — a single API call propagates
#     # to every zone that references the list. When zone_ids is set, WAF Custom
#     # Rules are automatically managed in each zone (no manual setup needed).
#     # Token scope: Account → Account Filter Lists → Edit (+ Zone → Firewall Services → Edit if using zone_ids).
#     # mode: lists
#     # account_id: 0123456789abcdef0123456789abcdef
#     # list_name: ezyshield_blocked      # default; auto-created if missing
#     # zone_ids:                          # optional; when set, WAF rules are auto-created per zone
#     #   - abc123def456                  # Cloudflare zone ID (Dashboard → Overview)
#     #   - xyz789uvw012
#     #
#     # Mode "rulesets" (legacy; one WAF rule per zone, ~200 IP cap auto-split).
#     # Token scope: Zone → Firewall → Edit on each listed zone.
#     # mode: rulesets
#     # zone_ids:
#     #   - abc123def456                  # Cloudflare zone ID (Dashboard → Overview)
#
#   # bunny.net edge enforcer (issue #197/#198) — blocks IPs at the bunny edge
#   # via each pull zone's blocked-IP list. NOTE: that list has no per-entry
#   # tagging, so EzyShield takes ownership of it on the zones below — IPs
#   # blocked by hand in the bunny panel are removed on reconcile.
#   # bunny:
#     # api_key: env:BUNNY_API_KEY       # must be "env:VARNAME"; inline values rejected
#     # pull_zones:                      # numeric pull zone IDs (bunny panel → Pull Zone → ID in the URL)
#     #   - 123456
#     #   - 234567

# AI analysis (issue #12) — disabled by default
# ai:
#   provider: anthropic
#   ambiguous_band: [30, 69]         # only scores in this band consult the AI;
#                                    # keep the upper bound BELOW policy ban_threshold —
#                                    # scores >= the threshold already decide a ban on
#                                    # rules alone and are never sent to the AI (issue #419)
#   cache_ttl: 15m                   # verdict cache (default 15m when omitted or 0)
#   token_budget_daily: 500000

# Notifications — configure channels and test with 'ezyshield test notifier <channel>'
# Secrets must use env: references; inline values are rejected at load time.
# notify:
#   rate_limit_per_minute: 5   # max notifications per channel per minute (default 5)
#   dedup_window_sec: 600      # suppress repeat IP+reason pairs for 10 min (default 600)
#
#   telegram:
#     bot_token: env:TELEGRAM_BOT_TOKEN
#     chat_ids:
#       - "-1001234567890"     # channel or group chat ID (use @username or numeric ID)
#     severity: []             # empty = all severities; or: [warn, critical]
#
#   email:
#     from: ezyshield@example.com
#     to:
#       - admin@example.com
#     host: smtp.example.com
#     port: 587                # 587 = STARTTLS (default), 465 = implicit TLS
#     username: ezyshield@example.com
#     password: env:SMTP_PASSWORD
#     tls: starttls            # starttls | tls | none
#     severity: []             # empty = all severities; or: [critical]

# IP reputation feeds (issue #194) — download + parse only for now; applying
# them to enforcement is a follow-up. Feeds are remote input that will
# influence blocking, so they are heavily sanitized: https only, 10MiB/4KiB
# caps, and private/loopback/link-local ranges are ALWAYS dropped (a feed can
# never smuggle 10.0.0.0/8).
# feeds:
#   - name: spamhaus-drop
#     url: https://www.spamhaus.org/drop/drop.txt
#     format: cidr             # plain | cidr | abuseipdb
#     refresh_interval: 12h    # minimum 1h
#     # max_entries: 100000    # default 100k; hard cap 500k
#     # timeout: 30s
# Verified-bot protection (issue #215) — spare well-known crawlers from
# over-eager rules via forward-confirmed reverse DNS (never UA alone: a
# spoofed Googlebot UA whose rDNS does not confirm is banned normally).
# Built-in providers: googlebot, bingbot, applebot, yandexbot, baiduspider,
# duckduckbot. Docs: guides/verified-bots.
# verified_bots:
#   enabled: true
#   providers:                       # optional: extend/override by name
#     - name: mymonitor
#       ua_contains: [MyMonitor]     # case-insensitive UA substrings
#       domains: [monitor.example.com]  # PTR must fall under one of these

# Data retention (issue #184) — OPT-IN: without this section nothing is ever
# pruned. Bounds database growth and documents your GDPR/LGPD retention
# policy (IPs are personal data). Active bans and the allowlist are never
# touched. Docs: reference/retention.
# retention:
#   strikes: 730d              # strike history (floor 180d) — powers repeat-offender
#                              # escalation; fully-aged offenders reset to strike 1
#   audit: 365d                # audit journal (floor 90d) — ALSO requires
#                              # audit_export_not_required below before any deletion
#   ai_usage: 90d              # AI cost accounting (floor 7d)
#   i_understand_the_risks: false      # allow windows below the floors (never below 24h)
#   audit_export_not_required: false   # acknowledge audit rows are deleted with no export
# Docker exec activity watcher (issue #220) — post-exploitation visibility.
# Observational ONLY: a `docker exec` into a container is audited, shown in
# `ezyshield watch`, and notified (warn) — never a ban source (there is
# usually no remote IP to ban). Docs: guides/docker-exec-watch.
# docker_exec:
#   enabled: true
#   ignore:                    # legitimate tooling (globs or substrings)
#     - "healthcheck*"
#     - cron
# Webshell-drop tripwire (opt-in) — sweeps web roots for new or modified
# executable web files (.php etc.). Purely observational: audit trail +
# notification (critical when content heuristics flag the file). It NEVER
# bans — a filesystem event has no remote IP. A tripwire, not an antivirus.
# webshell_watch:
#   enabled: true
#   roots:
#     - /var/www/html
#   ignore:
#     - cache            # substring match anywhere in the path
#     - "*.bak.php"      # or path.Match glob
#   # extensions: [".php", ".phtml", ".php5", ".php7", ".phar"]  # default
#   # interval_sec: 10   # sweep cadence (floor 5)
